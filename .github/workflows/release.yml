name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml)"
          tag="${GITHUB_REF_NAME#v}"
          test "$version" = "$tag" || {
            echo "Tag $tag does not match pubspec version $version"
            exit 1
          }

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required when signing is enabled'; exit 1; }
            test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required when signing is enabled'; exit 1; }
            test -n "$ANDROID_STORE_PASSWORD" || { echo 'ANDROID_STORE_PASSWORD is required when signing is enabled'; exit 1; }
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
            cat > android/key.properties <<EOF
            storePassword=$ANDROID_STORE_PASSWORD
            keyPassword=$ANDROID_KEY_PASSWORD
            keyAlias=$ANDROID_KEY_ALIAS
            storeFile=upload-keystore.jks
            EOF
          else
            echo "Android signing secrets not set; building unsigned release artifact."
          fi

      - run: flutter pub get
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: dual-tap-android-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS release artifact
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Archive iOS app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app artifacts/dual-tap-ios-${GITHUB_REF_NAME}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: dual-tap-ios-${{ github.ref_name }}
          path: artifacts/dual-tap-ios-${{ github.ref_name }}.zip
          if-no-files-found: error
